<!DOCTYPE html>
<!-- 文档类型声明 -->
<html lang="en">
<!-- 文档语言设置 -->

<head>
  <!-- 文档头部 -->
  <!-- 字符集设置 -->
  <meta charset="UTF-8">
  <!-- 视口设置 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 标题设置 -->
  <title>标题</title>
</head>

<body>
  <h1>什么是HTML</h1>
  <!-- 水平线 -->
  <hr>
  <p>
    HTML是超文本标记语言, 标记语言是一套标记标签,HTML使用标记标签来描述网页的结构和内容。
    我们学习HTML本质是学习HTML的标记标签。
  </p>
</body>

</html>
